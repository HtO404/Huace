; ============================================
; FTP上传/下载稳定性测试配置文件
; ============================================
[FtpConfig]
; FTP服务器地址
ftp_server = 192.168.1.1
; FTP端口
ftp_port = 21
; FTP账号
ftp_username = root
; FTP密码
ftp_password = <YOUR_PASSWORD>
; 被动模式
passive_mode = false

[TestParams]
; 测试类型: 1-上传速率测试, 2-下载速率测试
test_type = 1
; 测试循环次数
cycle_times = 100
; 测试文件大小(MB)
file_size_mb = 500
; 测试文件完整路径(留空则自动生成)
test_file_path = D:\Hcode\500mb_test_file.dat
; 块传输缓冲区大小(B)
buffer_size = 1048576
; 测试间隔(秒)
test_interval = 10
; 连接超时(秒)
connect_timeout = 30
; 传输超时(秒)
timeout = 60
; 成功率阈值(%)
success_threshold = 95.0

[OutputConfig]
; 项目名称
project_name = ls8_up_load
; 输出根目录（使用相对路径，打包后会在exe所在目录生成）
root_path = .
; 导出编号基准
base_export_num = 1
