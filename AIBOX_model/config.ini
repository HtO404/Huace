; ============================================
; AIBOX 运营商切换测试配置文件
; ============================================

[AppConfig]
; 项目名称
project_name = AIBOX_model
; 输出根目录
root_path = ./output
; 地面站应用包名
app_package = com.huace.groundstation

[DeviceConfig]
; 设备序列号（为空则自动连接）
device_serial =10328da4
; 连接超时(秒)
connect_timeout = 30

[TestParams]
; 循环次数（默认1次，会被main()中的用户输入覆盖）
cycle_times = 1
; 操作间隔(秒)
wait_interval = 3
; 运营商切换超时(秒)
operator_switch_timeout = 100
; 卡死检测超时(秒)
freeze_timeout = 200
; 是否启用应用重启功能
enable_app_restart = true

[UIElements]
; ===== 导航相关UI元素 =====
; 手动飞行按钮
manual_flight = com.huace.groundstation:id/fly_self
; 右侧空白区域（点击关闭弹窗）
right_blank_area = 0.95, 0.5
; 三菜单按钮
menu_button = com.huace.groundstation:id/btnMore
; 4G选项
option_4g = com.huace.groundstation:id/radioButton4GSetting
; 返回按钮
back_button_id = com.huace.groundstation:id/activity_fly_mode_main_top_sb_back

; ===== 运营商切换相关UI元素 =====
; 中国联通单选按钮
operator_unicom = com.huace.groundstation:id/rb_ai_box_operator_unicom
; 中国电信单选按钮
operator_telecom = com.huace.groundstation:id/rb_ai_box_operator_telecom
; 中国移动单选按钮
operator_mobile = com.huace.groundstation:id/rb_ai_box_operator_mobile
; 设置参数请稍等弹窗
loading_dialog = com.huace.groundstation:id/tv_message
; 网络频段等级（切换成功判断依据）
network_level = com.huace.groundstation:id/tv_aircraft_network_section_level

[OutputConfig]
; 导出编号基准
base_export_num = 0
; 截图模式: full(全程截图), reduced(仅关键节点), minimal(仅失败时)
screenshot_mode = reduced
