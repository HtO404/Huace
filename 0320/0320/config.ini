; ============================================
; AIBOX_LD 配置
; ============================================
[AppConfig]
; 项目名称
project_name = AIBOX_LD
; 输出根目录

root_path = D:\Hcode\AIBOX_LD

; ============================================
; 测试参数
; ============================================
[TestParams]
; 设备序列号
device_serial = d23ed084
; 循环次数
cycle_times = 3000
; 导出编号基准
base_export_num = 1
; 操作间隔(秒)
wait_interval = 1
; 成功率阈值(%)
success_threshold = 95.0
; 最大等待时间(秒)
max_wait_time = 60
; 双击坐标列表 (x1,y1,x2,y2,...)
click_coords = 250,600,1670,600

; ============================================
; UI元素定位
; ============================================
[UIElements]
; LFP元素XPath
lfp_xpath = //android.view.ViewGroup[7]//android.widget.TextView
; LFP元素文本关键词
lfp_text_keyword = LFP
; LFP值范围
lfp_bounds = 864,1080,1286,1176
