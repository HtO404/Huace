[AppConfig]
project_name = ls8_wifi_first
root_path = .
ls8_package_name = com.huace.landstar
ls8_main_activity = com.huace.landstar.ui.StartActivity
settings_package_name = com.android.settings

[UIElements]
# 步骤0: 点击 "我同意"按钮（应用启动后的隐私协议）
ls8_agree_btn = com.huace.landstar:id/btnAgree
# 步骤1: 点击 "点击连接设备"
ls8_connect_device_btn = 点击连接设备
# 步骤2: 点击 "选择连接设备"
ls8_select_wifi_list = com.huace.landstar:id/tvWifiName
# 步骤3: 目标WiFi名称
target_wifi_name = GNSS-9999002
#已连接的目标WiFi名称
target_wifi_name_connected = GNSS-9999002已连接
# 步骤4: 验证 "已连接" 状态
ls8_wifi_connected_status = 已连接
ls8_back_btn = //android.widget.ImageButton[@content-desc="返回"]
# 步骤5: 点击主界面 "连接" 按钮
ls8_main_connect_btn = com.huace.landstar:id/btnConnect
# 步骤6: 等待 "固定" 状态
ls8_fixed_status_indicator = com.huace.landstar:id/tvSolveStatus
# 步骤7: 系统设置
settings_network_text = 网络和互联网
settings_internet_text = 互联网
settings_forget_wifi_btn = com.android.settings:id/button1
# 弹窗监测
base_station_change_dialog = 基站坐标发生变化
confirm_button = 确认
ls8_three_button_layout_id = com.huace.landstar:id/layout_three_button

[DefaultParams]
cycle_times = 100
base_export_num = 1
wait_operate = 3
success_threshold = 99.0
test_mode = 2
