; ============================================
; AIBOX_LD 配置文件
; 集中管理所有程序运行时的变量
; ============================================

; ============================================
; 应用配置
; ============================================
[AppConfig]
; 项目名称
project_name = AIBOX_LD
; 输出根目录
root_path = .

; ============================================
; 测试参数
; ============================================
[TestParams]
; 设备序列号（为空则连接默认设备）
device_serial =
; 循环次数
cycle_times = 10
; 操作间隔(秒)
wait_interval = 3
; 双击坐标列表 (x1,y1,x2,y2,...)
click_coords = 300,600,1620,600

; ============================================
; UI元素定位
; ============================================
[UIElements]
; LFP值范围坐标 (x1,y1,x2,y2)
lfp_bounds = 864,1080,1286,1176

; ============================================
; OCR识别配置
; ============================================
[OCRConfig]
; Tesseract OCR路径
tesseract_path = C:\Program Files\Tesseract-OCR\tesseract.exe
; 图像增强对比度系数
contrast_enhance = 2.0
; OCR语言
ocr_language = eng
; 超时时间(秒)
timeout = 60

; ============================================
; 复位操作配置
; ============================================
[ResetConfig]
; 复位控件ID - cbOrientation
cb_orientation_id = com.huace.groundstation:id/cbOrientation
; 复位控件ID - btnHome
btn_home_id = com.huace.groundstation:id/btnHome
; 最大重试次数
max_retries = 3
; 复位操作间隔(秒)
reset_wait_interval = 3
; 操作计数阈值（达到此数值后执行复位）
operation_threshold = 10

; ============================================
; 调试配置
; ============================================
[DebugConfig]
; 调试模式（true/false）
debug_mode = false
; 截图标记前缀
screenshot_prefix = screen
