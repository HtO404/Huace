; ============================================
; 4G拨号连接测试配置文件
; ============================================
[SSHConfig]
; SSH服务器地址
ssh_host = 192.168.65.1
; SSH端口
ssh_port = 22
; SSH账号
ssh_username = root
; SSH密码
ssh_password = <YOUR_PASSWORD>

[TestParams]
; 测试循环次数
cycle_times = 1
; 脚本路径
script_path = /data/sbin/start_4g.sh
; 日志文件路径
log_file = /log/4g.log
; 日志行数
log_lines = 4
; Ping测试地址
ping_address = www.baidu.com
; Ping超时时间(秒)
ping_timeout = 10
; 成功率阈值(%)
success_threshold = 95.0

[OutputConfig]
; 项目名称
project_name = ls8_4g_smart
; 输出根目录
root_path = .\ls8_4g_smart_log
; 导出编号基准
base_export_num = 1
