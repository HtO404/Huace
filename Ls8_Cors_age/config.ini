; ============================================
; Ls8_Cors_age 配置
; ============================================
[AppConfig]
; 项目名称
project_name = Ls8_Cors_age
; 输出根目录（使用相对路径，打包后会在exe所在目录生成）
root_path = .
; 应用包名
package_name = com.huace.landstar
; 主Activity
main_activity = com.huace.landstar.ui.StartActivity

; ============================================
; 测试参数
; ============================================
[TestParams]
; 循环次数
cycle_times = 100
; 导出编号基准
base_export_num = 1
; 操作间隔(秒)
wait_interval = 0.02
; 成功率阈值(%)
success_threshold = 95.0
; 最大等待时间(秒)
max_wait_time = 60

; ============================================
; UI元素定位
; ============================================
[UIElements]
; 差分龄期
diff_age_id = com.huace.landstar:id/tvDiffAge
; 同意按钮
agree_btn = com.huace.landstar:id/btnAgree
; 连接设备按钮
connect_device_btn = 点击连接设备
; WiFi列表项
wifi_list_item = com.huace.landstar:id/tvWifiName
; 目标WiFi名称
target_wifi = GNSS-9999002
; 返回按钮
back_btn = //android.widget.ImageButton[@content-desc="返回"]
